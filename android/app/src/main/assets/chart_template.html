<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; overflow: hidden; }
    #chart { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
function renderChart(jsonStr) {
    try {
        var spec = JSON.parse(jsonStr);
        spec.layout = spec.layout || {};
        spec.layout.paper_bgcolor = 'rgba(0,0,0,0)';
        spec.layout.plot_bgcolor = 'rgba(13,17,23,1)';
        spec.layout.font = { color: '#e6edf3', size: 11 };
        spec.layout.margin = spec.layout.margin || { l: 50, r: 20, t: 50, b: 50 };
        spec.layout.autosize = true;
        Plotly.newPlot('chart', spec.data, spec.layout, {
            responsive: true,
            displayModeBar: false,
            staticPlot: false
        });
    } catch(e) {
        document.getElementById('chart').innerHTML =
            '<p style="color:#8b949e;text-align:center;padding:40px;">Chart loading...</p>';
    }
}
</script>
</body>
</html>
