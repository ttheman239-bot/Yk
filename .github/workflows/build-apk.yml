name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync web app into Android assets
        run: |
          cp index.html android/app/src/main/assets/index.html
          cp app.js android/app/src/main/assets/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/lead-lag.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lead-lag-debug
          path: dist/lead-lag.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Latest debug build
          body: |
            Debug build of Lead-Lag Signal Analyzer.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Built: ${{ github.event.head_commit.timestamp }}

            Direct download:
            https://github.com/${{ github.repository }}/releases/download/snapshot/lead-lag.apk
          prerelease: true
          make_latest: "false"
          files: dist/lead-lag.apk
